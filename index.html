<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Car Count Live</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#5d6b78;--line:#dfe4ea;--acc:#2f7d32;--accbg:#e4f2e5;--warn:#b26a00;--warnbg:#fff1d6;--bad:#b3261e;--badbg:#fde4e2;--blue:#1f5fbf}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#19212a;--ink:#e8eef4;--mut:#9aa8b6;--line:#2a3541;--acc:#6fcf74;--accbg:#1c3a20;--warn:#f0b050;--warnbg:#3a2c10;--bad:#ff8a80;--badbg:#3d1b18;--blue:#7fb2ff}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
main{max-width:760px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;margin:4px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:.2px}
.sub{color:var(--mut);font-size:14px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--line);color:var(--ink)}
.chip.go{background:var(--accbg);color:var(--acc)}.chip.pz{background:var(--warnbg);color:var(--warn)}.chip.done{background:var(--accbg);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.big{display:flex;gap:12px}
.big>div{flex:1}
.num{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.lab{color:var(--mut);font-size:13px;margin-top:4px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .6s}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.t b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.t span{color:var(--mut);font-size:12.5px}
h2{font-size:15px;margin:18px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.lot{margin:0 0 12px}.lot h3{font-size:15px;margin:0 0 6px}
.rows{display:flex;flex-wrap:wrap;gap:6px}
.r{min-width:86px;flex:1 1 86px;max-width:150px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card)}
.r b{font-size:15px}.r span{display:block;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.r.full{background:var(--accbg);border-color:transparent}.r.full span{color:var(--acc);font-weight:600}
.r.part{border-color:var(--blue)}
.req{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:12px;border:0;background:var(--blue);color:#fff;min-height:46px}
button:disabled{opacity:.55}
#stale{display:none;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
#stale.on{display:block}
.msg{font-size:14px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
</style></head><body><main>
<header><div><h1 id="ttl">Car count</h1><div class="sub" id="sub"></div></div><span class="chip" id="st">Connecting…</span></header>
<div id="stale"></div>
<div id="body"><div class="card empty">Connecting to the count…</div></div>
<div class="req"><button id="rq">Request update</button><span class="msg" id="rqm"></span></div>
<p class="sub" id="upd" style="margin-top:14px"></p>
</main>
<script>
/* Set these two lines once, or open the page with a link that ends in #d=<database address>&b=<board name> */
var DB="",BOARD="",EXP=0;
(function(){var h=location.hash.replace(/^#/,"").split("&");h.forEach(function(p){var kv=p.split("="),k=kv[0],v=decodeURIComponent(kv[1]||"");if(k==="d")DB=v;if(k==="b")BOARD=v;if(k==="x")EXP=parseInt(v,10)||0;});})();
DB=String(DB).replace(/\/+$/,"");BOARD=String(BOARD).replace(/[^A-Za-z0-9_-]/g,"");
var D=null,lastOk=0,reqAt=0,reqLast=0;
function $(i){return document.getElementById(i);}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function f(n){return Number(n||0).toLocaleString();}
function tm(ms){return new Date(ms).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}
function ago(ms){var s=Math.max(0,Math.round((Date.now()-ms)/1000));if(s<60)return s+" sec ago";var m=Math.round(s/60);if(m<60)return m+" min ago";return Math.round(m/60)+" hr ago";}
function draw(){
  if(!D){return;}
  var done=D.done|0,tg=D.target>0?D.target:null,togo=tg!=null?Math.max(0,tg-done):null,pct=tg?Math.min(100,done/tg*100):0;
  $("ttl").textContent=D.vessel||"Car count";
  $("sub").textContent=[D.yard,D.foreman?"Foreman "+D.foreman:"",D.started?"Started "+tm(D.started):""].filter(Boolean).join(" · ");
  var st=$("st");
  if(tg&&done>=tg){st.textContent="Complete";st.className="chip done";}
  else if(D.paused){st.textContent="Paused since "+tm(D.paused);st.className="chip pz";}
  else if(D.started){st.textContent="Receiving";st.className="chip go";}
  else{st.textContent="Not started";st.className="chip";}
  var h='<div class="card"><div class="big"><div><div class="num">'+f(done)+'</div><div class="lab">cars discharged</div></div>'+
    (tg!=null?'<div><div class="num">'+f(togo)+'</div><div class="lab">to go of '+f(tg)+' expected</div></div>':'')+'</div>'+
    (tg?'<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="lab">'+Math.round(pct)+'% done</div>':'')+'</div>';
  h+='<div class="tiles"><div class="t"><b>'+esc(D.rate||"–")+'</b><span>cars per hour (shift)</span></div><div class="t"><b>'+esc(D.last||"–")+'</b><span>cars in the last hour</span></div>'+
     '<div class="t"><b>'+esc(D.eta||"–")+'</b><span>estimated finish</span></div><div class="t"><b>'+(D.started?tm(D.started):"–")+'</b><span>shift started</span></div></div>';
  var L=D.lots||[];
  if(L.length){h+='<h2>Rows in use</h2>';L.forEach(function(l){h+='<div class="lot"><h3>Lot '+esc(l.lot)+'</h3><div class="rows">';
    (l.rows||[]).forEach(function(r){var full=r.f===1,part=!full&&r.c>0;
      h+='<div class="r'+(full?" full":part?" part":"")+'"><b>'+esc(r.n)+'</b><span>'+(full?f(r.c)+" cars":part?f(Math.max(0,r.p-r.c))+" to go":f(r.p)+" spots")+'</span></div>';});
    h+='</div></div>';});}
  $("body").innerHTML=h;
  $("upd").textContent="Updated "+tm(D.ts)+" ("+ago(D.ts)+")";
  var s=$("stale"),age=Date.now()-D.ts;
  if(age>120000){s.textContent="These numbers are "+ago(D.ts).replace(" ago","")+" old. The counter may be offline. Tap Request update.";s.className="on";}else s.className="";
  if(reqAt&&D.ts>=reqAt){$("rqm").textContent="Updated "+tm(D.ts)+".";reqAt=0;}
}
function poll(){
  if(EXP&&Date.now()>EXP){$("st").textContent="Expired";$("rq").style.display="none";$("body").innerHTML='<div class="card empty">This link has expired. Ask for a new QR code.</div>';D=null;return;}
  if(!DB||!BOARD){$("body").innerHTML='<div class="card empty">This page needs its link. Ask for the full boss link.</div>';$("st").textContent="No link";return;}
  fetch(DB+"/live/"+BOARD+"/data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    lastOk=Date.now();if(d&&typeof d==="object"){D=d;draw();}else{$("st").textContent="Waiting";$("body").innerHTML='<div class="card empty">Nothing has been sent yet. The count will appear here once the shift is set up.</div>';}
  }).catch(function(){if(!D){$("st").textContent="Offline";$("body").innerHTML='<div class="card empty">Could not reach the count. Trying again…</div>';}else{$("upd").textContent="Connection lost. Last update "+tm(D.ts)+".";}});
}
$("rq").onclick=function(){
  if(!DB||!BOARD)return;var now=Date.now();if(now-reqLast<30000){$("rqm").textContent="Already requested. Please wait a moment.";return;}
  reqLast=now;$("rq").disabled=true;$("rqm").textContent="Asking…";
  fetch(DB+"/req/"+BOARD+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:String(now)}).then(function(r){if(!r.ok)throw 0;reqAt=now;$("rqm").textContent="Requested. Waiting for the counter…";poll();}).catch(function(){$("rqm").textContent="Could not send the request.";}).then(function(){setTimeout(function(){$("rq").disabled=false;},30000);});
};
poll();setInterval(poll,5000);setInterval(function(){if(D)draw();},30000);
</script></body></html>
